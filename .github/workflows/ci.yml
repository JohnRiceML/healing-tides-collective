name: CI

# Type-check + run the Vitest suite on every push and PR — mirrors the local
# quality gate in AGENTS.md (`npx tsc --noEmit` + `npm test`). No secrets or DB
# needed: the tests mock the DB, Clerk auth, and Next's cache.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: types + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
